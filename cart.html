<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ hàng - MiniShop</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
</head>

<body>
    <!-- ĐẦU TRANG -->
    <header class="site-header">
        <h1>MiniShop</h1>
        <nav class="main-nav">
            <a href="index.html">Trang chủ</a> |
            <a href="about.html">Giới thiệu</a> |
            <a href="contact.html">Liên hệ</a> |
            <a href="cart.html" class="active">Giỏ hàng</a> |
            <a href="login.html">Đăng nhập</a> |
            <a href="register.html">Đăng ký</a>
        </nav>
    </header>

    <!-- NỘI DUNG CHÍNH -->
    <main>
        <h2>Giỏ hàng</h2>

        <table class="cart-table">
            <thead>
                <tr>
                    <th>Sản phẩm</th>
                    <th>Đơn giá</th>
                    <th>Số lượng</th>
                    <th>Thành tiền</th>
                </tr>
            </thead>
            <tbody>
                <tr data-price="250000">
                    <td>Chuột không dây M1</td>
                    <td>250.000 đ</td>
                    <td><input type="number" class="qty" min="1" value="2"></td>
                    <td class="line-total"></td>
                </tr>
                <tr data-price="150000">
                    <td>USB 64GB U4</td>
                    <td>150.000 đ</td>
                    <td><input type="number" class="qty" min="1" value="3"></td>
                    <td class="line-total"></td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <th colspan="3">Tổng cộng</th>
                    <th id="cart-total"></th>
                </tr>
            </tfoot>
        </table>

        <p>
            <button type="button" class="btn" id="clear-cart">
                Xóa giỏ hàng
            </button>

            <button type="button" class="btn btn-accent">
                Đặt hàng
            </button>
        </p>
    </main>

    <!-- CHÂN TRANG -->
    <footer class="site-footer">
        <p>&copy; 2026 MiniShop. Dự án thực hành lập trình web.</p>
    </footer>
</body>

</html>
